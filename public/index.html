<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تجربة البث المباشر</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 800px;
            text-align: center;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input, button {
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid #1f2833;
            background: #1f2833;
            color: white;
            font-size: 15px;
        }
        button {
            background-color: #45f3ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .video-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            background: #000;
            position: relative;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #45f3ff;
            line-height: 1.6;
        }
        .debug-box {
            margin-top: 15px;
            padding: 10px;
            background: #14161d;
            border-radius: 6px;
            font-size: 12px;
            color: #888;
            word-break: break-all;
            direction: ltr;
        }
    </style>
    <!-- مكتبة HLS لدعم صيغ البث المباشر m3u8 -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
</head>
<body>

<div class="container">
    <h2>🧪 تجربة البث المباشر (استخراج خام)</h2>
    
    <div class="controls">
        <input type="text" id="tmdbInput" placeholder="أدخل TMDB ID" value="550">
        <button onclick="loadStream()">تشغيل الفيلم</button>
    </div>

    <div class="video-box">
        <video id="myVideo" controls playsinline preload="auto"></video>
    </div>
    
    <div id="status">اضغط على زر التشغيل للبدء...</div>
    <div id="debug" class="debug-box">رابط المصدر سيظهر هنا...</div>
</div>

<script>
    let hlsInstance = null;

    async function loadStream() {
        const id = document.getElementById('tmdbInput').value.trim();
        const status = document.getElementById('status');
        const debug = document.getElementById('debug');
        const video = document.getElementById('myVideo');

        if (!id) return;

        status.innerText = "⏳ جاري استخراج رابط البث من الخادم...";
        debug.innerText = "Connecting...";

        try {
            const res = await fetch(`/api/source?id=${id}&type=movie`);
            const data = await res.json();

            if (!data.streamUrl) {
                status.innerText = "❌ لم يتم العثور على رابط مباشر.";
                return;
            }

            const streamUrl = data.streamUrl;
            debug.innerText = "URL: " + streamUrl;
            status.innerText = "✅ تم استخراج الرابط. انقر على زر التشغيل (Play) في المشغل أدناه:";

            if (hlsInstance) {
                hlsInstance.destroy();
                hlsInstance = null;
            }

            if (streamUrl.includes('.m3u8')) {
                if (Hls.isSupported()) {
                    hlsInstance = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true
                    });
                    hlsInstance.loadSource(streamUrl);
                    hlsInstance.attachMedia(video);
                    
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, function () {
                        video.play().catch(() => {
                            status.innerText = "▶️ الرابط جاهز للتشغيل. اضغط زر التشغيل داخل نافذة الفيديو.";
                        });
                    });

                    hlsInstance.on(Hls.Events.ERROR, function (event, data) {
                        if (data.fatal) {
                            status.innerText = "⚠️ خطأ في استقبال تدفق HLS (ربما قيود CORS من مزود الفيديو).";
                        }
                    });
                } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                    video.src = streamUrl;
                }
            } else {
                // ملف فيديو مباشر (MP4)
                video.src = streamUrl;
                video.load();
                video.play().catch(() => {
                    status.innerText = "▶️ تم تحميل الفيديو! اضغط زر التشغيل في المشغل.";
                });
            }

            video.onerror = function() {
                status.innerText = "❌ فشل تحميل المصدر داخل المتصفح. قد يكون الرابط محظوراً أو منتهي الصلاحية.";
            };

        } catch (err) {
            status.innerText = "⚠️ حدث خطأ أثناء الاتصال: " + err.message;
        }
    }
</script>
</body>
</html>

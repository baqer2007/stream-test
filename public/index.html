<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الدمج الذكي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0b0c10; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 12px; }
        .controls { display: flex; gap: 8px; background: #14161d; padding: 10px; border-radius: 8px; flex-wrap: wrap; }
        input, select, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #2d3748; background: #1f2833; color: #fff; font-size: 14px; }
        input { flex: 2; min-width: 120px; }
        select { flex: 1; }
        button { background: #45f3ff; color: #000; font-weight: bold; border: none; cursor: pointer; }
        .player-box { width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        iframe { width: 100%; height: 100%; border: none; }
        #status { font-size: 13px; color: #45f3ff; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="mediaId" value="129" placeholder="TMDB ID">
        <select id="mediaType">
            <option value="movie">فيلم</option>
            <option value="tv">مسلسل</option>
        </select>
        <button onclick="fetchUnifiedStream()">تشغيل العمل</button>
    </div>

    <div class="player-box">
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
    </div>

    <div id="status">النظام بانتظار أمر التشغيل...</div>
</div>

<script>
    async function fetchUnifiedStream() {
        const id = document.getElementById('mediaId').value.trim();
        const type = document.getElementById('mediaType').value;
        const player = document.getElementById('videoPlayer');
        const status = document.getElementById('status');

        status.innerText = "🔍 الخادم يدمج المصادر ويختار السيرفر المتوفر...";
        player.src = "";

        try {
            const res = await fetch(`/api/stream?id=${id}&type=${type}`);
            const data = await res.json();

            if (data.embedUrl) {
                player.src = data.embedUrl;
                status.innerText = `✅ تم اختيار وتشغيل: ${data.provider}`;
            } else {
                status.innerText = "❌ تعذر العثور على العمل.";
            }
        } catch (e) {
            status.innerText = "⚠️ خطأ في الاتصال بالخادم: " + e.message;
        }
    }

    window.onload = fetchUnifiedStream;
</script>
</body>
</html>

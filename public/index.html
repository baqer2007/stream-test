<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفحص المستقر</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        input, select, button {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #1f2833;
            background: #1f2833;
            color: white;
            font-size: 14px;
        }
        button {
            background-color: #45f3ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        #info {
            margin-top: 15px;
            font-size: 13px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 مشغل الفحص الذكي</h2>
    
    <div class="controls">
        <input type="text" id="tmdbInput" placeholder="TMDB ID" value="550">
        <select id="serverSelect" onchange="loadVideo()">
            <!-- السيرفرات التي لا تفرض حظراً جغرافياً صارماً -->
            <option value="https://player.videasy.net/movie/">سيرفر 1 (Videasy)</option>
            <option value="https://player.autoembed.cc/embed/movie/">سيرفر 2 (AutoEmbed)</option>
            <option value="https://multiembed.mov/?video_id=">سيرفر 3 (MultiEmbed)</option>
        </select>
        <button onclick="loadVideo()">تشغيل العمل</button>
    </div>

    <div class="player-wrapper">
        <!-- إضافة الصلاحيات الدقيقة التي تمنع ظهور رسالة الحظر: allow-modals allow-scripts allow-same-origin allow-forms -->
        <iframe id="videoPlayer" 
                src="" 
                allowfullscreen 
                allow="autoplay; encrypted-media; fullscreen"
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
        </iframe>
    </div>

    <div id="info">تم ضبط درع الأمان لمنع كشف الـ Sandbox وحظر الإعلانات.</div>
</div>

<script>
    // حظر النوافذ الإعلانية المنبثقة برمجياً من الصفحة الأب
    window.open = function () {
        console.log("تم اعتراض ومنع نافذة إعلانية منبثقة!");
        return null;
    };

    function loadVideo() {
        const id = document.getElementById('tmdbInput').value.trim();
        const base = document.getElementById('serverSelect').value;
        const player = document.getElementById('videoPlayer');

        if (!id) return;

        if (base.includes("multiembed")) {
            player.src = base + id + "&tmdb=1";
        } else {
            player.src = base + id;
        }
    }

    // تشغيل تلقائي عند الفتح
    window.onload = loadVideo;
</script>
</body>
</html>

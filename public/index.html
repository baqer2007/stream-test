<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث المدمج مع الترجمة التلقائية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0b0c10; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 12px; }
        .controls { display: flex; gap: 8px; background: #14161d; padding: 12px; border-radius: 8px; flex-wrap: wrap; }
        input, select, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #2d3748; background: #1f2833; color: #fff; font-size: 14px; outline: none; }
        input { flex: 2; min-width: 120px; }
        select { flex: 1; min-width: 110px; }
        button { background: #45f3ff; color: #000; font-weight: bold; border: none; cursor: pointer; }
        .player-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        iframe { width: 100%; height: 100%; border: none; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; background: #14161d; padding: 10px 15px; border-radius: 8px; }
        .badge { color: #45f3ff; font-weight: bold; }
        .sub-bar { background: #14161d; padding: 10px 15px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .sub-btn { background: #45f3ff; color: #000; font-weight: bold; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="mediaId" value="129" placeholder="معرّف TMDB (مثال: 129 أو 550)">
        <select id="mediaType">
            <option value="movie">فيلم (Movie)</option>
            <option value="tv">مسلسل (TV Show)</option>
        </select>
        <button onclick="startAutoStream()">تشغيل العمل</button>
    </div>

    <div class="player-box">
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
    </div>

    <div class="status-bar">
        <div id="statusText">جاري الفحص...</div>
        <button onclick="switchServer()" style="background:transparent; border:1px solid #45f3ff; color:#45f3ff; font-size:12px; padding:4px 8px; border-radius:4px; cursor:pointer;">سيرفر مكمّل ⏭️</button>
    </div>

    <div class="sub-bar">
        <div>
            <span id="mediaTitleLabel">الترجمة العربية للعمل:</span>
            <span style="color:#aaa; font-size:11px; display:block;">البحث التلقائي عن ملفات الترجمة المتوافقة بدقة:</span>
        </div>
        <a id="subDownloadLink" class="sub-btn" href="#" target="_blank">جلب الترجمة العربية 📥</a>
    </div>
</div>

<script>
    let currentImdbId = "";
    let currentTitle = "";
    let currentServerIndex = 0;

    // مصادر تدعم معرفات TMDB و IMDb
    const serverEngines = [
        {
            name: "سيرفر SuperEmbed VIP",
            build: (type, tmdb, imdb) => `https://multiembed.mov/?video_id=${imdb || tmdb}&tmdb=1`
        },
        {
            name: "سيرفر VidLink HD",
            build: (type, tmdb, imdb) => type === 'movie' 
                ? `https://vidlink.pro/movie/${tmdb}?sub=ar` 
                : `https://vidlink.pro/tv/${tmdb}/1/1?sub=ar`
        }
    ];

    async function startAutoStream() {
        const id = document.getElementById('mediaId').value.trim();
        const type = document.getElementById('mediaType').value;
        const status = document.getElementById('statusText');
        const titleLabel = document.getElementById('mediaTitleLabel');
        const subLink = document.getElementById('subDownloadLink');

        if (!id) return;
        status.innerText = "🔍 جاري استخراج بيانات العمل وربط الترجمة...";

        try {
            // جلب تفاصيل العمل ومعرف IMDb الرسمي
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=42898950d8ce08e496a9cf1c26569ec5&language=en-US`);
            const data = await res.json();

            currentTitle = data.title || data.name || id;
            currentImdbId = data.imdb_id || "";

            // ضبط رابط الترجمة بالاعتماد على IMDb أو اسم العمل بدقة لتجنب خطأ (0 نتائج)
            if (currentImdbId) {
                subLink.href = `https://subdl.com/subtitle/${currentImdbId}`;
            } else {
                subLink.href = `https://subdl.com/search/${encodeURIComponent(currentTitle)}`;
            }

            titleLabel.innerText = `العمل: ${currentTitle} (${currentImdbId || 'TMDB: ' + id})`;
            currentServerIndex = 0;
            renderPlayer();

        } catch (e) {
            currentTitle = id;
            currentImdbId = "";
            subLink.href = `https://subdl.com/search/${id}`;
            renderPlayer();
        }
    }

    function renderPlayer() {
        const id = document.getElementById('mediaId').value.trim();
        const type = document.getElementById('mediaType').value;
        const player = document.getElementById('videoPlayer');
        const status = document.getElementById('statusText');

        const engine = serverEngines[currentServerIndex];
        status.innerHTML = `المصدر المفعّل: <span class="badge">${engine.name}</span> [${currentServerIndex + 1}/${serverEngines.length}]`;
        player.src = engine.build(type, id, currentImdbId);
    }

    function switchServer() {
        currentServerIndex = (currentServerIndex + 1) % serverEngines.length;
        renderPlayer();
    }

    window.onload = startAutoStream;
</script>
</body>
</html>

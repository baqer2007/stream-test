<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة البث المدمجة والترجمة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0b0c10; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 12px; }
        .controls { display: flex; gap: 8px; background: #14161d; padding: 12px; border-radius: 8px; flex-wrap: wrap; }
        input, select, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #2d3748; background: #1f2833; color: #fff; font-size: 14px; outline: none; }
        input { flex: 2; min-width: 120px; }
        select { flex: 1; min-width: 110px; }
        button { background: #45f3ff; color: #000; font-weight: bold; border: none; cursor: pointer; }
        .player-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        iframe { width: 100%; height: 100%; border: none; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; background: #14161d; padding: 10px 15px; border-radius: 8px; }
        .badge { color: #45f3ff; font-weight: bold; }
        .sub-alert { font-size: 12px; color: #ffb703; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="mediaId" value="129" placeholder="TMDB ID">
        <select id="mediaCategory" onchange="runAutoAggregator()">
            <option value="anime">أنمي / كوري / تركي</option>
            <option value="global">أفلام ومسلسلات عالمية</option>
        </select>
        <select id="mediaType">
            <option value="movie">فيلم (Movie)</option>
            <option value="tv">مسلسل (TV Show)</option>
        </select>
        <button onclick="runAutoAggregator()">تشغيل العمل</button>
    </div>

    <div class="player-box">
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
    </div>

    <div class="status-bar">
        <div id="statusText">جاري التجهيز...</div>
        <button onclick="nextFallbackSource()" style="background:transparent; border:1px solid #45f3ff; color:#45f3ff; font-size:12px; padding:5px 10px; border-radius:4px; cursor:pointer;">سيرفر بديل ⏭️</button>
    </div>

    <div class="sub-alert">
        💡 تم ضبط السيرفرات لفرض تشغيل الترجمة العربية تلقائياً (`Arabic Subtitles On`).
    </div>
</div>

<script>
    // سيرفرات مدمجة ومخصصة بحسب نوع التصنيف
    const serverRoutes = {
        // قائمة الأنمي والدراما الآسيوية مع تفعيل باراميترات العربية
        anime: [
            {
                name: "سيرفر AutoEmbed Anime (ترجمة عربية مدمجة)",
                build: (t, id) => t === 'movie' 
                    ? `https://player.autoembed.cc/embed/movie/${id}?sub=ar` 
                    : `https://player.autoembed.cc/embed/tv/${id}/1/1?sub=ar`
            },
            {
                name: "سيرفر Vidsrc CC (داعم لملفات الترجمة المتعددة)",
                build: (t, id) => t === 'movie' 
                    ? `https://vidsrc.cc/v2/embed/movie/${id}?autoPlay=false` 
                    : `https://vidsrc.cc/v2/embed/tv/${id}/1/1?autoPlay=false`
            },
            {
                name: "سيرفر Smashy (مشغل أنمي دولي)",
                build: (t, id) => t === 'movie' 
                    ? `https://player.smashystream.xyz/movie/${id}` 
                    : `https://player.smashystream.xyz/tv/${id}?s=1&e=1`
            }
        ],
        // قائمة الأفلام والمسلسلات العالمية وهوليوود
        global: [
            {
                name: "سيرفر VidLink HD (عالمي حديث مع ترجمة)",
                build: (t, id) => t === 'movie' 
                    ? `https://vidlink.pro/movie/${id}?sub=ar` 
                    : `https://vidlink.pro/tv/${id}/1/1?sub=ar`
            },
            {
                name: "سيرفر AutoEmbed Global",
                build: (t, id) => t === 'movie' 
                    ? `https://player.autoembed.cc/embed/movie/${id}?sub=ar` 
                    : `https://player.autoembed.cc/embed/tv/${id}/1/1?sub=ar`
            }
        ]
    };

    let activeChain = [];
    let chainIndex = 0;

    function runAutoAggregator() {
        const cat = document.getElementById('mediaCategory').value;
        activeChain = serverRoutes[cat] || serverRoutes.anime;
        chainIndex = 0;
        renderStream();
    }

    function renderStream() {
        const id = document.getElementById('mediaId').value.trim();
        const type = document.getElementById('mediaType').value;
        const player = document.getElementById('videoPlayer');
        const status = document.getElementById('statusText');

        if (!id) return;

        const currentProvider = activeChain[chainIndex];
        status.innerHTML = `المصدر المفعّل: <span class="badge">${currentProvider.name}</span> [${chainIndex + 1}/${activeChain.length}]`;
        player.src = currentProvider.build(type, id);
    }

    function nextFallbackSource() {
        if (activeChain.length === 0) return;
        chainIndex = (chainIndex + 1) % activeChain.length;
        renderStream();
    }

    window.onload = runAutoAggregator;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث المدمج</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }
        body {
            background-color: #0b0c10;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 15px;
        }
        .container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .search-box {
            display: flex;
            gap: 10px;
            background: #14161d;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #1f2833;
            flex-wrap: wrap;
        }
        input, select, button {
            padding: 10px 14px;
            border-radius: 6px;
            border: 1px solid #2d3748;
            background: #1f2833;
            color: white;
            font-size: 14px;
            outline: none;
        }
        input { flex: 2; min-width: 140px; }
        select { flex: 1; min-width: 120px; }
        button {
            background-color: #45f3ff;
            color: #0b0c10;
            font-weight: bold;
            cursor: pointer;
            border: none;
            flex: 1;
            min-width: 100px;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        .status-badge {
            font-size: 13px;
            color: #45f3ff;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-badge span {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #45f3ff;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="search-box">
        <input type="text" id="mediaId" placeholder="معرّف TMDB (مثال: 550 أو 94605)" value="94605">
        <select id="mediaType" onchange="toggleInputs()">
            <option value="tv">مسلسل (TV Show)</option>
            <option value="movie">فيلم (Movie)</option>
        </select>
        <input type="number" id="seasonNum" placeholder="الموسم" value="1" style="max-width: 80px;">
        <input type="number" id="episodeNum" placeholder="الحلقة" value="1" style="max-width: 80px;">
        <button onclick="startUnifiedStream()">تشغيل العمل</button>
    </div>

    <!-- واجهة مشغل واحدة بدون أزرار سيرفرات مبعثرة -->
    <div class="player-wrapper">
        <iframe id="unifiedPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>

    <div class="status-badge">
        <span></span>
        <div id="engineStatus">نظام الدمج الذكي: جاهز للاتصال</div>
    </div>
</div>

<script>
    // قائمة السيرفرات المدمجة خلف الكواليس (تركي، آسيوي، وعالمي)
    const integratedPool = [
        {
            name: "المصدر الرئيسي",
            buildUrl: (t, id, s, e) => t === 'movie' 
                ? `https://vidlink.pro/movie/${id}`
                : `https://vidlink.pro/tv/${id}/${s}/${e}`
        },
        {
            name: "مصدر المحتوى الآسيوي والتركي",
            buildUrl: (t, id, s, e) => t === 'movie'
                ? `https://player.videasy.net/movie/${id}`
                : `https://player.videasy.net/tv/${id}/${s}/${e}`
        },
        {
            name: "المصدر الاحتياطي السريع",
            buildUrl: (t, id, s, e) => t === 'movie'
                ? `https://player.autoembed.cc/embed/movie/${id}`
                : `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`
        }
    ];

    let activePoolIndex = 0;

    function toggleInputs() {
        const isTv = document.getElementById('mediaType').value === 'tv';
        document.getElementById('seasonNum').style.display = isTv ? 'block' : 'none';
        document.getElementById('episodeNum').style.display = isTv ? 'block' : 'none';
    }

    // منطق الدمج: اختيار وتشغيل المصدر تلقائياً دون إظهاره للمستخدم
    function startUnifiedStream() {
        activePoolIndex = 0;
        loadNextAvailableSource();
    }

    function loadNextAvailableSource() {
        if (activePoolIndex >= integratedPool.length) {
            document.getElementById('engineStatus').innerText = "❌ تعذر العثور على بث شغال من جميع المصادر المدمجة.";
            return;
        }

        const id = document.getElementById('mediaId').value.trim();
        const type = document.getElementById('mediaType').value;
        const s = document.getElementById('seasonNum').value;
        const e = document.getElementById('episodeNum').value;
        const player = document.getElementById('unifiedPlayer');
        const status = document.getElementById('engineStatus');

        const currentEngine = integratedPool[activePoolIndex];
        const streamTarget = currentEngine.buildUrl(type, id, s, e);

        status.innerText = `جاري الاتصال والتشغيل تلقائياً عبر: ${currentEngine.name}...`;
        player.src = streamTarget;

        // إذا حدث خطأ في التحميل داخل الإطار ينتقل تلقائياً للمصدر الذي يليه
        player.onerror = () => {
            activePoolIndex++;
            loadNextAvailableSource();
        };
    }

    window.onload = () => {
        toggleInputs();
        startUnifiedStream();
    };
</script>
</body>
</html>

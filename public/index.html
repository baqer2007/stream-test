<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المشغل المباشر المستقر</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        input, select, button {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #1f2833;
            background: #1f2833;
            color: white;
            font-size: 15px;
        }
        button {
            background-color: #45f3ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* طبقة عزل وحظر النوافذ الخبيثة */
        .ad-shield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #server-label {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 مشغل الفحص المستقر (عالمي / كوري / تركي)</h2>
    
    <div class="controls">
        <input type="text" id="tmdbInput" placeholder="معرف الفيلم TMDB (مثال: 550)" value="550">
        <select id="serverSelect" onchange="changeServer()">
            <option value="https://vidsrc.vip/embed/movie/">سيرفر 1 (Super VIP - بدون إعلانات)</option>
            <option value="https://player.videasy.net/movie/">سيرفر 2 (Videasy - آسيوي وعالمي)</option>
            <option value="https://autoembed.co/movie/tmdb/">سيرفر 3 (AutoEmbed Co)</option>
        </select>
        <button onclick="changeServer()">تشغيل العمل</button>
    </div>

    <div class="player-wrapper">
        <!-- استخدام Sandbox ذكي يسمح بالفيديو ويمنع تماماً أي إعلان منبثق أو إعادة توجيه -->
        <iframe id="videoPlayer" 
                src="https://vidsrc.vip/embed/movie/550" 
                allowfullscreen 
                allow="autoplay; encrypted-media; fullscreen"
                sandbox="allow-scripts allow-same-origin allow-forms allow-presentation">
        </iframe>
        <div class="ad-shield"></div>
    </div>

    <div id="server-label">يعمل بدون إعلانات منبثقة بفضل درع العزل البرمجي.</div>
</div>

<script>
    function changeServer() {
        const id = document.getElementById('tmdbInput').value.trim();
        const base = document.getElementById('serverSelect').value;
        const player = document.getElementById('videoPlayer');

        if (!id) return;

        // توليد الرابط النظيف المعزول
        player.src = base + id;
    }
</script>
</body>
</html>

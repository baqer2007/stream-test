<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة البث المدمجة مع الترجمة الفورية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0b0c10; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 12px; }
        .controls { display: flex; gap: 8px; background: #14161d; padding: 12px; border-radius: 8px; flex-wrap: wrap; }
        input, select, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #2d3748; background: #1f2833; color: #fff; font-size: 14px; outline: none; }
        input { flex: 2; min-width: 120px; }
        select { flex: 1; min-width: 110px; }
        button { background: #45f3ff; color: #000; font-weight: bold; border: none; cursor: pointer; }
        .player-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        iframe { width: 100%; height: 100%; border: none; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; background: #14161d; padding: 10px 15px; border-radius: 8px; }
        .badge { color: #45f3ff; font-weight: bold; }
        .sub-bar { background: #14161d; padding: 10px 15px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; justify-content: space-between; gap: 10px; }
        .sub-btn { background: #45f3ff; color: #000; font-weight: bold; padding: 6px 12px; border-radius: 4px; text-decoration: none; font-size: 12px; display: inline-block; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="mediaId" value="129" placeholder="TMDB ID">
        <select id="mediaType">
            <option value="movie">فيلم (Movie)</option>
            <option value="tv">مسلسل (TV Show)</option>
        </select>
        <button onclick="loadStream()">تشغيل العمل</button>
    </div>

    <div class="player-box">
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
    </div>

    <div class="status-bar">
        <div id="statusText">جاهز للتشغيل...</div>
        <button onclick="toggleServer()" style="background:transparent; border:1px solid #45f3ff; color:#45f3ff; font-size:12px; padding:4px 8px; border-radius:4px; cursor:pointer;">سيرفر مكمّل ⏭️</button>
    </div>

    <!-- ميزة الترجمة المباشرة للأنمي والمحتوى الآسيوي -->
    <div class="sub-bar">
        <div>
            <span>💬 للترجمة العربية المباشرة داخل المشغل:</span>
            <span style="color:#aaa; font-size:11px; display:block;">انقر زر Subtitle في المشغل ثم Upload واختر ملف الترجمة الجاهز فوراً:</span>
        </div>
        <a id="subDownloadLink" class="sub-btn" href="#" target="_blank">تحميل الترجمة العربية 📥</a>
    </div>
</div>

<script>
    // المصادر التي تم التأكد من أنها لا تعطي شاشة رمادية
    const workingServers = [
        {
            name: "سيرفر SuperEmbed (يعمل بدون حظر)",
            build: (t, id) => `https://multiembed.mov/?video_id=${id}&tmdb=1`
        },
        {
            name: "سيرفر VidLink HD (عالمي سريع)",
            build: (t, id) => t === 'movie' ? `https://vidlink.pro/movie/${id}` : `https://vidlink.pro/tv/${id}/1/1`
        }
    ];

    let currentIdx = 0;

    function loadStream() {
        const id = document.getElementById('mediaId').value.trim();
        const type = document.getElementById('mediaType').value;
        const player = document.getElementById('videoPlayer');
        const status = document.getElementById('statusText');
        const subLink = document.getElementById('subDownloadLink');

        if (!id) return;

        // تشغيل السيرفر الفعّال
        const active = workingServers[currentIdx];
        status.innerHTML = `المصدر المفعّل: <span class="badge">${active.name}</span>`;
        player.src = active.build(type, id);

        // توفير رابط ترجمة عربي مباشر ومطابق للـ TMDB ID للتحميل بنقرة واحدة
        subLink.href = `https://subdl.com/search?tmdb_id=${id}`;
    }

    function toggleServer() {
        currentIdx = (currentIdx + 1) % workingServers.length;
        loadStream();
    }

    window.onload = loadStream;
</script>
</body>
</html>

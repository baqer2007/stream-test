<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل استخراج البث المباشر المترجم</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0b0c10; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 14px; }
        .search-row { display: flex; gap: 8px; background: #14161d; padding: 12px; border-radius: 8px; }
        input { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #2d3748; background: #1f2833; color: #fff; font-size: 14px; outline: none; }
        button { padding: 10px 20px; background: #45f3ff; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .video-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        video, iframe { width: 100%; height: 100%; border: none; }
        #log { font-size: 13px; color: #45f3ff; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-row">
        <input type="text" id="queryInput" value="Inception" placeholder="اكتب اسم العمل بالإنجليزية أو العربية...">
        <button onclick="requestRawStream()">سحب وتشغيل 🎬</button>
    </div>

    <div class="video-box" id="playerBox">
        <video id="directPlayer" controls playsinline></video>
    </div>

    <div id="log">اكتب اسم العمل واضغط "سحب وتشغيل"...</div>
</div>

<script>
    let hlsInstance = null;

    async function requestRawStream() {
        const title = document.getElementById('queryInput').value.trim();
        const box = document.getElementById('playerBox');
        const log = document.getElementById('log');

        if (!title) return;

        log.innerText = `🔍 جاري البحث في أكوام وسحب رابط الفيديو لـ (${title})...`;

        // إفراغ الحاوية السابقة
        box.innerHTML = '<video id="directPlayer" controls playsinline></video>';
        const video = document.getElementById('directPlayer');

        if (hlsInstance) {
            hlsInstance.destroy();
            hlsInstance = null;
        }

        try {
            const res = await fetch(`/api/extract?title=${encodeURIComponent(title)}`);
            const data = await res.json();

            if (!data.success || !data.streamUrl) {
                log.innerText = `❌ ${data.error || "تعذر العثور على العمل."}`;
                return;
            }

            const streamUrl = data.streamUrl;

            // إذا كان الرابط مباشراً (HLS أو MP4)
            if (data.isDirect) {
                if (streamUrl.includes('.m3u8') && Hls.isSupported()) {
                    hlsInstance = new Hls();
                    hlsInstance.loadSource(streamUrl);
                    hlsInstance.attachMedia(video);
                    hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                        log.innerText = `✅ البث الخام المترجم يعمل بنجاح: ${data.title}`;
                        video.play().catch(() => {});
                    });
                } else {
                    video.src = streamUrl;
                    video.play().catch(() => {});
                    log.innerText = `✅ تم تشغيل ملف الفيديو المباشر: ${data.title}`;
                }
            } else {
                // إذا كان مشغلاً مخصصاً
                box.innerHTML = `<iframe src="${streamUrl}" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>`;
                log.innerText = `✅ تم فتح المشغل المباشر بنجاح: ${data.title}`;
            }

        } catch (err) {
            log.innerText = "⚠️ خطأ في الاتصال بالخادم: " + err.message;
        }
    }
</script>
</body>
</html>

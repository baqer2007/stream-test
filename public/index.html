<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل الفحص بدون حظر</title>
    <style>
        body {
            background-color: #0b0c10;
            color: #ffffff;
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 900px;
            text-align: center;
        }
        .controls {
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }
        input, select, button {
            padding: 12px 16px;
            border-radius: 8px;
            border: 1px solid #1f2833;
            background: #1f2833;
            color: white;
            font-size: 14px;
        }
        button {
            background-color: #45f3ff;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            border: none;
        }
        .player-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            background: #000;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        /* درع امتصاص نقرات الإعلانات */
        #clickShield {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: transparent;
            z-index: 10;
            cursor: pointer;
        }
        #info {
            margin-top: 15px;
            font-size: 13px;
            color: #45f3ff;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎬 تجربة المشغل (بدون كشف Sandbox)</h2>
    
    <div class="controls">
        <input type="text" id="tmdbInput" placeholder="TMDB ID" value="550">
        <select id="serverSelect" onchange="loadVideo()">
            <option value="https://player.videasy.net/movie/">Videasy (عالمي وآسيوي)</option>
            <option value="https://player.autoembed.cc/embed/movie/">AutoEmbed Fast</option>
            <option value="https://multiembed.mov/?video_id=">MultiEmbed Direct</option>
        </select>
        <button onclick="loadVideo()">تشغيل الفيلم</button>
    </div>

    <div class="player-wrapper">
        <!-- أزلنا الـ sandbox نهائياً حتى لا يظهر حظر الفيديو إطلاقاً -->
        <iframe id="videoPlayer" 
                src="" 
                allowfullscreen 
                allow="autoplay; encrypted-media; fullscreen">
        </iframe>
        <!-- الطبقة الذكية لمنع النوافذ المنبثقة من أول نقرة -->
        <div id="clickShield" onclick="handleShieldClick()"></div>
    </div>

    <div id="info">اضغط على شاشة الفيديو لبدء المشاهدة بدون نوافذ مزعجة.</div>
</div>

<script>
    // حظر النوافذ المنبثقة من المتصفح مباشرة
    window.open = function () {
        return null;
    };

    // منع تحويل الصفحة الرئيسية رغماً عن المستخدم
    window.onbeforeunload = function() {
        return "هل تريد مغادرة الموقع؟";
    };

    function handleShieldClick() {
        const shield = document.getElementById('clickShield');
        // إزالة الدرع بعد أول نقرة ليتمكن المستخدم من التحكم بالمشغل بحرية
        shield.style.display = 'none';
        
        // استعادة الدرع بعد 3 ثوانٍ في حال حاول السيرفر فتح إعلان لاحق
        setTimeout(() => {
            shield.style.display = 'none';
        }, 3000);
    }

    function loadVideo() {
        const id = document.getElementById('tmdbInput').value.trim();
        const base = document.getElementById('serverSelect').value;
        const player = document.getElementById('videoPlayer');
        const shield = document.getElementById('clickShield');

        shield.style.display = 'block';

        if (!id) return;

        if (base.includes("multiembed")) {
            player.src = base + id + "&tmdb=1";
        } else {
            player.src = base + id;
        }
    }

    window.onload = loadVideo;
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشغل البث الخام المباشر</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0b0c10; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 850px; display: flex; flex-direction: column; gap: 14px; }
        .search-row { display: flex; gap: 8px; background: #14161d; padding: 12px; border-radius: 8px; }
        input { flex: 1; padding: 10px 14px; border-radius: 6px; border: 1px solid #2d3748; background: #1f2833; color: #fff; font-size: 14px; outline: none; }
        button { padding: 10px 20px; background: #45f3ff; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .video-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        video { width: 100%; height: 100%; object-fit: contain; }
        #log { font-size: 13px; color: #45f3ff; text-align: center; }
    </style>
</head>
<body>

<div class="container">
    <div class="search-row">
        <input type="text" id="queryInput" value="Spirited Away" placeholder="اكتب اسم العمل...">
        <button onclick="requestRawStream()">سحب وتشغيل 🎬</button>
    </div>

    <div class="video-box">
        <video id="directPlayer" controls playsinline></video>
    </div>

    <div id="log">اضغط "سحب وتشغيل" لبدء البث المباشر...</div>
</div>

<script>
    let hls = null;

    async function requestRawStream() {
        const title = document.getElementById('queryInput').value.trim();
        const video = document.getElementById('directPlayer');
        const log = document.getElementById('log');

        if (!title) return;

        log.innerText = `⏳ جاري الاتصال بالخادم واستخراج البث لـ (${title})...`;

        try {
            const res = await fetch(`/api/extract?title=${encodeURIComponent(title)}`);
            const data = await res.json();

            if (!data.success || !data.streamUrl) {
                log.innerText = "❌ تعذر استخراج رابط مباشر.";
                return;
            }

            const streamUrl = data.streamUrl;

            // تشغيل تدفق m3u8 عبر HLS.js
            if (Hls.isSupported()) {
                if (hls) hls.destroy();
                hls = new Hls();
                hls.loadSource(streamUrl);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    log.innerText = `✅ البث الخام يعمل بنجاح وبدون إعلانات: ${data.title}`;
                    video.play().catch(() => {
                        log.innerText = `▶️ اضغط زر التشغيل (Play) في المشغل للبدء`;
                    });
                });
                hls.on(Hls.Events.ERROR, function(event, errData) {
                    if (errData.fatal) {
                        log.innerText = "⚠️ خطأ في قراءة ملف البث الخام.";
                    }
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', function() {
                    video.play();
                });
            }

        } catch (err) {
            log.innerText = "⚠️ حدث خطأ في الاتصال: " + err.message;
        }
    }
</script>
</body>
</html>

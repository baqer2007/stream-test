<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة البث التلقائي الذكية</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
        body { background: #0b0c10; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 15px; }
        .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 12px; }
        .controls { display: flex; gap: 8px; background: #14161d; padding: 12px; border-radius: 8px; flex-wrap: wrap; }
        input, select, button { padding: 10px 14px; border-radius: 6px; border: 1px solid #2d3748; background: #1f2833; color: #fff; font-size: 14px; outline: none; }
        input { flex: 2; min-width: 120px; }
        select { flex: 1; min-width: 100px; }
        button { background: #45f3ff; color: #000; font-weight: bold; border: none; cursor: pointer; }
        .player-box { position: relative; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.8); }
        iframe { width: 100%; height: 100%; border: none; }
        .status-bar { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #888; background: #14161d; padding: 10px 15px; border-radius: 8px; }
        .badge { color: #45f3ff; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <input type="text" id="mediaId" value="129" placeholder="TMDB ID">
        <select id="mediaType" onchange="toggleEpInputs()">
            <option value="movie">فيلم (Movie)</option>
            <option value="tv">مسلسل (TV Show)</option>
        </select>
        <input type="number" id="seasonNum" placeholder="الموسم" value="1" style="display:none; max-width: 75px;">
        <input type="number" id="episodeNum" placeholder="الحلقة" value="1" style="display:none; max-width: 75px;">
        <button onclick="detectAndRouteStream()">تشغيل العمل</button>
    </div>

    <div class="player-box">
        <iframe id="videoPlayer" src="" allowfullscreen allow="autoplay; encrypted-media; fullscreen"></iframe>
    </div>

    <div class="status-bar">
        <div id="statusText">جاري التجهيز...</div>
        <button onclick="nextServerFallback()" style="background:transparent; border:1px solid #45f3ff; color:#45f3ff; font-size:12px; padding:5px 10px; border-radius:4px; cursor:pointer;">سيرفر بديل ⏭️</button>
    </div>
</div>

<script>
    // سيرفرات المحتوى الآسيوي والأنمي (تدعم الترجمة المدمجة والخيارات المتعددة)
    const asianServers = [
        {
            name: "سيرفر AutoEmbed Multi (يدعم العربية)",
            build: (t, id, s, e) => t === 'movie'
                ? `https://player.autoembed.cc/embed/movie/${id}`
                : `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`
        },
        {
            name: "سيرفر SuperEmbed (خيارات جودة وسيرفرات داخلية)",
            build: (t, id, s, e) => t === 'movie' 
                ? `https://multiembed.mov/?video_id=${id}&tmdb=1` 
                : `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}`
        },
        {
            name: "سيرفر Smashy Multi (مشغل أنمي بديل)",
            build: (t, id, s, e) => t === 'movie' 
                ? `https://player.smashystream.xyz/movie/${id}` 
                : `https://player.smashystream.xyz/tv/${id}?s=${s}&e=${e}`
        },
        {
            name: "سيرفر 2Embed Anime",
            build: (t, id, s, e) => t === 'movie' 
                ? `https://www.2embed.cc/embed/${id}` 
                : `https://www.2embed.cc/embedtv/${id}&s=${s}&e=${e}`
        }
    ];

    // سيرفرات المحتوى العالمي وهوليوود
    const globalServers = [
        {
            name: "سيرفر VidLink HD",
            build: (t, id, s, e) => t === 'movie' 
                ? `https://vidlink.pro/movie/${id}?sub=ar` 
                : `https://vidlink.pro/tv/${id}/${s}/${e}?sub=ar`
        },
        {
            name: "سيرفر AutoEmbed Global",
            build: (t, id, s, e) => t === 'movie' 
                ? `https://player.autoembed.cc/embed/movie/${id}` 
                : `https://player.autoembed.cc/embed/tv/${id}/${s}/${e}`
        },
        {
            name: "سيرفر SuperEmbed VIP",
            build: (t, id, s, e) => t === 'movie' 
                ? `https://multiembed.mov/?video_id=${id}&tmdb=1` 
                : `https://multiembed.mov/?video_id=${id}&tmdb=1&s=${s}&e=${e}`
        }
    ];

    let activeQueue = [];
    let queueIndex = 0;

    function toggleEpInputs() {
        const isTv = document.getElementById('mediaType').value === 'tv';
        document.getElementById('seasonNum').style.display = isTv ? 'block' : 'none';
        document.getElementById('episodeNum').style.display = isTv ? 'block' : 'none';
    }

    async function detectAndRouteStream() {
        const id = document.getElementById('mediaId').value.trim();
        const type = document.getElementById('mediaType').value;
        const status = document.getElementById('statusText');

        if (!id) return;
        status.innerText = "⏳ جاري فحص هوية العمل وتحديد المسار...";

        try {
            const res = await fetch(`https://api.themoviedb.org/3/${type}/${id}?api_key=42898950d8ce08e496a9cf1c26569ec5&language=ar`);
            const data = await res.json();
            const lang = data.original_language || 'en';

            // حصر السيرفرات بحسب التخصص دون خلط لتفادي أخطاء الحجب
            if (['ja', 'ko', 'zh', 'tr'].includes(lang)) {
                activeQueue = asianServers;
            } else {
                activeQueue = globalServers;
            }

            queueIndex = 0;
            renderCurrentSource(data.title || data.name || id);

        } catch (err) {
            activeQueue = asianServers;
            queueIndex = 0;
            renderCurrentSource(id);
        }
    }

    function renderCurrentSource(title) {
        const id = document.getElementById('mediaId').value.trim();
        const type = document.getElementById('mediaType').value;
        const s = document.getElementById('seasonNum').value || 1;
        const e = document.getElementById('episodeNum').value || 1;
        const player = document.getElementById('videoPlayer');
        const status = document.getElementById('statusText');

        const currentSource = activeQueue[queueIndex];
        status.innerHTML = `العمل: <strong>${title}</strong> | المصدر: <span class="badge">${currentSource.name}</span> [${queueIndex + 1}/${activeQueue.length}]`;
        player.src = currentSource.build(type, id, s, e);
    }

    function nextServerFallback() {
        if (activeQueue.length === 0) return;
        queueIndex = (queueIndex + 1) % activeQueue.length;
        renderCurrentSource(document.getElementById('mediaId').value.trim());
    }

    window.onload = () => {
        toggleEpInputs();
        detectAndRouteStream();
    };
</script>
</body>
</html>
